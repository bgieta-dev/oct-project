# Base config = Config dataclass defaults (test18 lineage). BATCH_SIZE/ACCUMULATION_STEPS derive from MODEL_NAME.
MODEL_NAME: nvidia/mit-b2
NUM_LABELS: 4
TARGET_CLASS: null
USE_MULTIMODAL: true
USE_25D: true
SEED: 42
LR: 5.0e-05
EPOCHS: 80
USE_AMP: true
VAL_INTERVAL: 1
WARMUP_EPOCHS: 15
DROPOUT_RATE: 0.2
USE_DYNAMIC_WEIGHTS: true
CLASS_WEIGHTS: [0.2, 5.0, 2.0, 2.0]
USE_CLAHE: true
USE_TVERSKY: true
FOCAL_WEIGHT: 0.5
TVERSKY_WEIGHT: 0.5
FOCAL_GAMMA: 3.0
TVERSKY_ALPHA: 0.1
TVERSKY_BETA: 0.9
USE_BOUNDARY_LOSS: false
BOUNDARY_ALPHA: 0.1
CLASS_NAMES: {0: Background, 1: IRF, 2: SRF, 3: PED}
MIN_REGION_SIZE: 80
USE_TTA: true
TTA_SCALES: [0.8, 1.0, 1.2]
CLASS_THRESHOLDS: {1: 0.3, 2: 0.8, 3: 0.8}
ATTENTION_CONTRAST: 0.6
CENTRAL_SLICE_IDX: 1
AUG_SIZE: [512, 512]
AUG_SCALE: [0.8, 1.0]
AUG_PROBS: {flip: 0.5, rotate: 0.5, brightness: 0.2, noise: 0.2}
HYBRID_ENSEMBLE_MODE: soft
HYBRID_EXPERT_WEIGHT: 0.4
HYBRID_BLEND_STRATEGY: linear
HYBRID_IRF_THRESHOLD: 0.25
HYBRID_IRF_MIN_REGION_SIZE: 12
HYBRID_IRF_OVERRIDE: false
